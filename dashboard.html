<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>납품 현황판</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #14171c;
    color: #eef1f5;
    font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
    padding: 10px 14px 12px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 3px solid #2e3440;
    padding-bottom: 8px;
    flex-shrink: 0;
  }
  header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  #clock { font-size: 20px; color: #9aa3b2; font-variant-numeric: tabular-nums; }
  #status { font-size: 12px; color: #6b7383; margin-top: 3px; }
  #status.err { color: #ff5a4d; }

  .section {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .section-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 7px 0 5px;
    flex-shrink: 0;
  }
  .label-urgent { color: #ff5a4d; }
  .label-rest { color: #7f8a9b; }
  .label-line { flex: 1; height: 2px; background: #2e3440; }
  .page-indicator { font-size: 14px; color: #9aa3b2; font-weight: 700; font-variant-numeric: tabular-nums; }

  .grid {
    display: grid;
    gap: 8px;
    overflow: hidden;
    min-height: 0;
  }

  .card {
    background: #222731;
    border: 2px solid #39404e;
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    min-width: 0;
  }

  .card.level-danger {
    border-color: #ff5a4d;
    background: linear-gradient(160deg, #43201c 0%, #262a33 65%);
    animation: pulse 1.5s ease-in-out infinite;
  }
  .card.level-warn {
    border-color: #ffb02e;
    background: linear-gradient(160deg, #42331a 0%, #262a33 65%);
  }
  .card.level-ok { border-color: #2f5c41; }
  .card.level-done { opacity: 0.3; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,90,77,0.45); }
    50% { box-shadow: 0 0 0 7px rgba(255,90,77,0); }
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
  }

  .dday {
    font-weight: 900;
    line-height: 1;
    letter-spacing: -1px;
    white-space: nowrap;
  }
  .level-danger .dday { color: #ff5a4d; }
  .level-warn  .dday { color: #ffb02e; }
  .level-ok    .dday { color: #4ac97e; }
  .level-done  .dday { color: #6b7383; }

  .date { color: #9aa3b2; white-space: nowrap; }

  .name {
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .qty { font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
  .qty .frac { color: #9aa3b2; font-weight: 600; }

  .note {
    background: #39404e;
    color: #c7cede;
    font-weight: 700;
    border-radius: 20px;
    padding: 2px 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 1;
    min-width: 0;
  }

  .empty {
    color: #6b7383;
    font-size: 20px;
    text-align: center;
    padding: 24px;
    grid-column: 1 / -1;
    align-self: center;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>납품 현황판</h1>
      <div id="status">불러오는 중...</div>
    </div>
    <div id="clock"></div>
  </header>

  <div class="section" id="urgent-section">
    <div class="section-label label-urgent">
      <span>긴급 · 3일 이내</span>
      <span class="label-line"></span>
      <span class="page-indicator" id="urgent-count"></span>
    </div>
    <div class="grid" id="urgent-grid"></div>
  </div>

  <div class="section" id="rest-section">
    <div class="section-label label-rest">
      <span>예정</span>
      <span class="label-line"></span>
      <span class="page-indicator" id="page-indicator"></span>
    </div>
    <div class="grid" id="rest-grid"></div>
  </div>
</div>

<script>
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQcw5_g0rei6gwiue-cC5A6HgbnagX1EQtBk1pE2O36nAUeoMg4PCrWI-ABc247KLH/exec";
var SHEET_ID = "1dQXdZFNk0RRY1KKQIAuVuGUYpqd5TejbBZQalI0DYQQ";
var SHEET_NAME = "DATA";
var PUB_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRLXM6kN4l93bVUkEre3LPO6jz6CsdIeYrdScwn6b8TW_Fmh1ibVztXWEoQi31Wc1rPAMsTXozm0Arx/pub?gid=1372408514&single=true&output=csv";
var GVIZ_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(SHEET_NAME);
var EXPORT_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/export?format=csv";

var CSV_CANDIDATES = [
  { name: "웹게시", url: PUB_CSV_URL },
  { name: "gviz", url: GVIZ_URL },
  { name: "프록시gviz", url: "https://api.allorigins.win/raw?url=" + encodeURIComponent(GVIZ_URL) },
  { name: "프록시export", url: "https://api.allorigins.win/raw?url=" + encodeURIComponent(EXPORT_URL) }
];

var REFRESH_MS = 60000;
var PAGE_MS = 10000;
var URGENT_WITHIN = 3;

function xhrGet(url, isJson, ok, fail) {
  try {
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        if (isJson) {
          try { ok(JSON.parse(x.responseText)); } catch (e) { fail("파싱실패"); }
        } else {
          if (!x.responseText) fail("빈응답"); else ok(x.responseText);
        }
      } else fail("HTTP " + x.status);
    };
    x.onerror = function () { fail("네트워크"); };
    x.send();
  } catch (e) { fail("요청실패"); }
}

function parseCSV(text) {
  var rows = [], row = [], f = "", q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text.charAt(i);
    if (q) {
      if (c === '"') { if (text.charAt(i+1) === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ""; }
      else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ""; }
      else if (c !== '\r') f += c;
    }
  }
  if (f.length || row.length) { row.push(f); rows.push(row); }
  var out = [];
  for (var j = 0; j < rows.length; j++) {
    for (var k = 0; k < rows[j].length; k++) {
      if (rows[j][k].replace(/^\s+|\s+$/g, "") !== "") { out.push(rows[j]); break; }
    }
  }
  return out;
}

function toRecords(rows) {
  function t(v) { return (v || "").replace(/^\s+|\s+$/g, ""); }
  var out = [];
  for (var i = 1; i < rows.length; i++) {
    var r = rows[i];
    out.push({ date: t(r[0]), name: t(r[1]), qtyDue: t(r[2]), qtyIn: t(r[3]), note: t(r[6]) });
  }
  return out;
}

function parseDate(s) {
  if (!s) return null;
  var str = String(s).replace(/^\s+|\s+$/g, "");
  var iso = str.match(/^(\d{4})-(\d{2})-(\d{2})T/);
  if (iso) return new Date(+iso[1], +iso[2]-1, +iso[3]);
  var p = str.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
  if (p) return new Date(+p[1], +p[2]-1, +p[3]);
  var d = new Date(str.replace(/\./g,"-").replace(/\//g,"-"));
  return isNaN(d.getTime()) ? null : d;
}

function parseNum(s) {
  if (!s) return 0;
  var n = parseFloat(String(s).replace(/,/g, ""));
  return isNaN(n) ? 0 : n;
}

function fmtNote(s) {
  if (!s) return "";
  var str = String(s).replace(/^\s+|\s+$/g, "");
  var iso = str.match(/^(\d{4})-(\d{2})-(\d{2})T/);
  if (iso) return (+iso[2]) + "/" + (+iso[3]);
  return str;
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function ddayInfo(d) {
  var n = new Date();
  var today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var diff = Math.round((t - today) / 86400000);
  if (diff < 0) return { diff: diff, label: "D+" + Math.abs(diff), level: "danger" };
  if (diff === 0) return { diff: 0, label: "D-DAY", level: "danger" };
  if (diff <= 3) return { diff: diff, label: "D-" + diff, level: "danger" };
  if (diff <= 7) return { diff: diff, label: "D-" + diff, level: "warn" };
  return { diff: diff, label: "D-" + diff, level: "ok" };
}

var urgentItems = [], restItems = [], restPage = 0, restPerPage = 8;

// 카드 높이에 맞춰 폰트 크기 산출
function fontsFor(cardH, isUrgent) {
  var h = cardH;
  var k = isUrgent ? 1 : 0.9;
  function px(v, min, max) {
    var r = Math.round(v * k);
    if (r < min) r = min;
    if (r > max) r = max;
    return r + "px";
  }
  return {
    dday: px(h * 0.27, 16, 72),
    date: px(h * 0.125, 10, 26),
    name: px(h * 0.215, 13, 52),
    qty:  px(h * 0.20, 12, 46),
    frac: px(h * 0.145, 10, 32),
    note: px(h * 0.105, 9, 18)
  };
}

function cardHTML(it, F) {
  var info = ddayInfo(it.date);
  var level = it.done ? "done" : info.level;
  var dateStr = (it.date.getMonth()+1) + "/" + it.date.getDate() +
                " (" + ["일","월","화","수","목","금","토"][it.date.getDay()] + ")";
  var label = it.done ? "완료" : info.label;

  var h = '<div class="card level-' + level + '">';
  h += '<div class="row">';
  h += '<span class="dday" style="font-size:' + F.dday + '">' + label + '</span>';
  h += '<span class="date" style="font-size:' + F.date + '">' + dateStr + '</span>';
  h += '</div>';
  h += '<div class="name" style="font-size:' + F.name + '">' + esc(it.name) + '</div>';
  h += '<div class="row">';
  h += '<span class="qty" style="font-size:' + F.qty + '">' + it.qtyIn.toLocaleString() +
       ' <span class="frac" style="font-size:' + F.frac + '">/ ' + it.qtyDue.toLocaleString() + '</span></span>';
  if (it.note) h += '<span class="note" style="font-size:' + F.note + '">' + esc(it.note) + '</span>';
  h += '</div></div>';
  return h;
}

function colsFor(width) {
  if (width < 700) return 2;
  if (width < 1100) return 3;
  if (width < 1700) return 4;
  if (width < 2300) return 5;
  return 6;
}

function renderAll() {
  var app = document.getElementById("app");
  var header = app.querySelector("header");
  var uSec = document.getElementById("urgent-section");
  var rSec = document.getElementById("rest-section");
  var uGrid = document.getElementById("urgent-grid");
  var rGrid = document.getElementById("rest-grid");

  var appH = app.clientHeight;
  var padV = 22;
  var availH = appH - header.offsetHeight - padV;

  var labelH = 27;
  var uCount = urgentItems.length;
  var rCount = restItems.length;
  var width = app.clientWidth;
  var cols = colsFor(width);

  document.getElementById("urgent-count").textContent = uCount ? uCount + "건" : "";

  // ── 한쪽만 있는 경우
  if (uCount === 0 && rCount === 0) {
    uSec.style.display = "none";
    rSec.style.display = "flex";
    rSec.style.flex = "1 1 auto";
    rGrid.innerHTML = '<div class="empty">표시할 납품 일정이 없습니다.</div>';
    document.getElementById("page-indicator").textContent = "";
    return;
  }

  if (uCount === 0) {
    uSec.style.display = "none";
    rSec.style.display = "flex";
    rSec.style.flex = "1 1 auto";
    drawRest(availH - labelH, cols);
    return;
  }

  if (rCount === 0) {
    rSec.style.display = "none";
    uSec.style.display = "flex";
    uSec.style.flex = "1 1 auto";
    drawUrgent(availH - labelH, cols);
    return;
  }

  // ── 양쪽 다 있는 경우: 긴급 행 수에 따라 가변 배분
  uSec.style.display = "flex";
  rSec.style.display = "flex";

  var uRows = Math.ceil(uCount / cols);
  var gridH = availH - labelH * 2;

  // 긴급이 차지할 행 수 (최대 절반 조금 넘게)
  var maxURows = Math.max(1, Math.floor(gridH / 110 * 0.55));
  var useURows = Math.min(uRows, maxURows);

  // 긴급 카드 1장 최소 높이 확보
  var minCardH = 95;
  var totalRowsPossible = Math.max(2, Math.floor(gridH / minCardH));
  if (useURows > totalRowsPossible - 1) useURows = Math.max(1, totalRowsPossible - 1);

  var uH = Math.round(gridH * (useURows / totalRowsPossible));
  // 긴급은 조금 더 넉넉하게 (시인성 우선)
  uH = Math.round(uH * 1.15);
  var maxUH = Math.round(gridH * 0.62);
  if (uH > maxUH) uH = maxUH;
  var minUH = Math.min(Math.round(gridH * 0.28), 220);
  if (uH < minUH) uH = minUH;

  var rH = gridH - uH;

  drawUrgent(uH, cols);
  drawRest(rH, cols);
}

function drawUrgent(availH, cols) {
  var grid = document.getElementById("urgent-grid");
  var count = urgentItems.length;
  if (!count) { grid.innerHTML = ""; return; }

  var rows = Math.ceil(count / cols);
  var gap = 8;
  var cardH = (availH - gap * (rows - 1)) / rows;
  if (cardH < 70) {
    rows = Math.max(1, Math.floor((availH + gap) / (70 + gap)));
    cardH = (availH - gap * (rows - 1)) / rows;
  }

  grid.style.height = availH + "px";
  grid.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";
  grid.style.gridAutoRows = cardH + "px";

  var F = fontsFor(cardH, true);
  var html = "";
  var maxShow = cols * rows;
  for (var i = 0; i < Math.min(count, maxShow); i++) html += cardHTML(urgentItems[i], F);
  grid.innerHTML = html;
}

function drawRest(availH, cols) {
  var grid = document.getElementById("rest-grid");
  var ind = document.getElementById("page-indicator");
  var gap = 8;
  var minCardH = 88;

  var rows = Math.max(1, Math.floor((availH + gap) / (minCardH + gap)));
  var cardH = (availH - gap * (rows - 1)) / rows;

  restPerPage = cols * rows;
  var totalPages = Math.max(1, Math.ceil(restItems.length / restPerPage));
  if (restPage >= totalPages) restPage = 0;

  grid.style.height = availH + "px";
  grid.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";
  grid.style.gridAutoRows = cardH + "px";

  var F = fontsFor(cardH, false);
  var start = restPage * restPerPage;
  var page = restItems.slice(start, start + restPerPage);
  var html = "";
  for (var i = 0; i < page.length; i++) html += cardHTML(page[i], F);
  grid.innerHTML = html;

  ind.textContent = totalPages > 1
    ? (restPage + 1) + " / " + totalPages + "  (" + restItems.length + "건)"
    : restItems.length + "건";
}

function processRecords(records) {
  var urgent = [], rest = [], done = [];
  for (var i = 0; i < records.length; i++) {
    var r = records[i];
    var d = parseDate(r.date);
    if (!d) continue;
    var qtyDue = parseNum(r.qtyDue), qtyIn = parseNum(r.qtyIn);
    var isDone = qtyDue > 0 && qtyIn >= qtyDue;
    var item = { date: d, name: r.name || "(품명없음)", qtyDue: qtyDue, qtyIn: qtyIn, note: fmtNote(r.note), done: isDone };
    if (isDone) { done.push(item); continue; }
    if (ddayInfo(d).diff <= URGENT_WITHIN) urgent.push(item); else rest.push(item);
  }
  function byDate(a, b) { return a.date - b.date; }
  urgent.sort(byDate); rest.sort(byDate); done.sort(byDate);
  urgentItems = urgent;
  restItems = rest.concat(done);
  renderAll();
}

var isLoading = false;
function setStatus(t, err) {
  var el = document.getElementById("status");
  el.textContent = t;
  el.className = err ? "err" : "";
}

function tryCSV(list, i, errs) {
  if (i >= list.length) { setStatus("불러오기 실패", true); isLoading = false; return; }
  var e = list[i];
  var url = e.url + (e.url.indexOf("?") >= 0 ? "&" : "?") + "_=" + Date.now();
  xhrGet(url, false, function (text) {
    try {
      processRecords(toRecords(parseCSV(text)));
      setStatus("갱신 " + new Date().toLocaleTimeString("ko-KR") + " · " + e.name, false);
      isLoading = false;
    } catch (ex) { errs.push(e.name); tryCSV(list, i + 1, errs); }
  }, function (m) { errs.push(e.name); tryCSV(list, i + 1, errs); });
}

function load() {
  if (isLoading) return;
  isLoading = true;
  if (APPS_SCRIPT_URL) {
    var url = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf("?") >= 0 ? "&" : "?") + "_=" + Date.now();
    xhrGet(url, true, function (recs) {
      processRecords(recs);
      setStatus("갱신 " + new Date().toLocaleTimeString("ko-KR"), false);
      isLoading = false;
    }, function () { tryCSV(CSV_CANDIDATES, 0, []); });
    return;
  }
  tryCSV(CSV_CANDIDATES, 0, []);
}

function tickClock() {
  document.getElementById("clock").textContent =
    new Date().toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", weekday: "short", hour: "2-digit", minute: "2-digit" });
}

function nextPage() {
  if (!restItems.length) return;
  var total = Math.max(1, Math.ceil(restItems.length / restPerPage));
  if (total <= 1) return;
  restPage = (restPage + 1) % total;
  renderAll();
}

var rt;
window.onresize = function () { clearTimeout(rt); rt = setTimeout(renderAll, 200); };

tickClock();
setInterval(tickClock, 1000);
load();
setInterval(load, REFRESH_MS);
setInterval(nextPage, PAGE_MS);
</script>
</body>
</html>
